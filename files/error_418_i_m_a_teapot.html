<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>418 I'm a Teapot</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        amber: {
                            50: '#fffbeb',
                            100: '#fef3c7',
                            200: '#fde68a',
                            500: '#f59e0b',
                            600: '#d97706',
                            700: '#b45309',
                        }
                    },
                    keyframes: {
                        steam: {
                            '0%': { transform: 'translateY(0) scaleX(1)', opacity: '0' },
                            '15%': { opacity: '0.6' },
                            '50%': { transform: 'translateY(-20px) scaleX(1.2)', opacity: '0.4' },
                            '95%': { opacity: '0' },
                            '100%': { transform: 'translateY(-40px) scaleX(1.5)', opacity: '0' },
                        },
                        whistle: {
                            '0%, 100%': { transform: 'rotate(0deg)' },
                            '25%': { transform: 'rotate(-3deg) scale(1.02)' },
                            '75%': { transform: 'rotate(3deg) scale(1.02)' },
                        }
                    },
                    animation: {
                        steam1: 'steam 3s ease-out infinite',
                        steam2: 'steam 3s ease-out 1s infinite',
                        steam3: 'steam 3s ease-out 2s infinite',
                        whistle: 'whistle 0.5s ease-in-out infinite',
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Custom Steam Styling */
        .steam-particle {
            transform-origin: bottom center;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-amber-500 selection:text-slate-900">

    <!-- Main Container -->
    <main class="max-w-xl w-full bg-slate-800/80 backdrop-blur-md border border-slate-700/50 rounded-3xl p-8 md:p-12 shadow-2xl text-center relative overflow-hidden my-8">
        
        <!-- Background Ambient Glow -->
        <div class="absolute -top-24 -left-24 w-60 h-60 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -right-24 w-60 h-60 bg-amber-600/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Header / Error Tag -->
        <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-400 text-xs sm:text-sm font-semibold tracking-wide uppercase mb-6">
            <i class="fa-solid font-bold fa-triangle-exclamation"></i>
            <span>HTTP Status Code</span>
        </div>

        <!-- Big 418 Code -->
        <h1 class="text-7xl sm:text-8xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-amber-500 tracking-tight mb-2">
            418
        </h1>

        <!-- Teapot SVG Illustration -->
        <div class="relative w-48 h-48 sm:w-56 sm:h-56 mx-auto my-4 flex items-center justify-center">
            
            <!-- Steam Effect Container -->
            <div id="steam-container" class="absolute top-2 left-1/2 -translate-x-1/2 w-16 h-16 pointer-events-none z-10 opacity-80">
                <svg class="w-full h-full text-amber-200/60" viewBox="0 0 100 100" fill="currentColor">
                    <!-- Steam strand 1 -->
                    <path class="steam-particle animate-steam1" d="M 30,80 Q 20,50 40,20 Q 50,10 40,0 Q 30,10 20,20 Q 0,50 20,80 Z" />
                    <!-- Steam strand 2 -->
                    <path class="steam-particle animate-steam2" d="M 50,80 Q 60,50 40,20 Q 30,10 40,0 Q 50,10 60,20 Q 80,50 60,80 Z" />
                    <!-- Steam strand 3 -->
                    <path class="steam-particle animate-steam3" d="M 70,80 Q 60,50 70,20 Q 75,10 70,0 Q 65,10 60,20 Q 50,50 60,80 Z" />
                </svg>
            </div>

            <!-- Stylish Teapot SVG -->
            <svg id="teapot-svg" class="w-full h-full filter drop-shadow-[0_10px_20px_rgba(245,158,11,0.25)] transition-transform duration-300 hover:scale-105 cursor-pointer" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Lid Knob -->
                <circle cx="100" cy="52" r="7" class="fill-amber-400" />
                <!-- Lid -->
                <path d="M 80 62 C 80 56, 120 56, 120 62 L 124 68 C 124 70, 76 70, 76 68 Z" class="fill-amber-500" />
                <!-- Teapot Body -->
                <path d="M 50 100 C 45 150, 155 150, 150 100 C 145 72, 55 72, 50 100 Z" class="fill-amber-500" />
                <!-- Body Highlight Accent -->
                <path d="M 65 95 C 62 125, 138 125, 135 95" class="stroke-amber-400/40" stroke-width="4" stroke-linecap="round" fill="none" />
                <!-- Base -->
                <path d="M 70 144 C 80 148, 120 148, 130 144 L 126 150 C 120 152, 80 152, 74 150 Z" class="fill-amber-600" />
                <!-- Spout -->
                <path d="M 142 92 C 165 85, 175 60, 172 52 C 170 50, 166 52, 164 56 C 158 68, 148 78, 138 82 Z" class="fill-amber-500" />
                <!-- Handle -->
                <path d="M 55 85 C 25 80, 15 125, 52 132 C 42 122, 38 90, 58 92 Z" class="fill-amber-600" />
                <!-- Playful Face Overlay -->
                <!-- Left Eye -->
                <circle cx="85" cy="102" r="3.5" class="fill-slate-900" />
                <!-- Right Eye -->
                <circle cx="115" cy="102" r="3.5" class="fill-slate-900" />
                <!-- Cute Mouth -->
                <path d="M 96 110 Q 100 114 104 110" class="stroke-slate-900" stroke-width="2.5" stroke-linecap="round" fill="none" />
                <!-- Rosy Cheeks -->
                <circle cx="78" cy="107" r="3" class="fill-amber-300/60" />
                <circle cx="122" cy="107" r="3" class="fill-amber-300/60" />
            </svg>
        </div>

        <!-- Title -->
        <h2 class="text-2xl sm:text-3xl font-bold text-slate-100 mb-3">
            I'm a Teapot
        </h2>

        <!-- Humorous Explanation -->
        <p class="text-slate-400 text-sm sm:text-base leading-relaxed mb-8 max-w-md mx-auto">
            The requested server refuses the attempt to brew coffee because it is, permanently and proudly, a teapot. 
            <span class="block mt-2 text-xs sm:text-sm text-slate-500 italic">(RFC 2324 / Hyper Text Coffee Pot Control Protocol)</span>
        </p>

        <!-- Interactive Message Box (Hidden by default) -->
        <div id="message-box" class="hidden mb-6 p-4 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-200 text-sm animate-fade-in">
            <span id="message-text"></span>
        </div>

        <!-- Interactive Buttons -->
        <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
            <!-- Brew Coffee Button -->
            <button id="brew-btn" onclick="attemptBrew()" class="w-full sm:w-auto px-6 py-3.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-bold text-sm tracking-wide hover:from-amber-400 hover:to-amber-500 active:scale-95 transition-all shadow-lg shadow-amber-500/20 flex items-center justify-center gap-2">
                <i class="fa-solid fa-mug-hot"></i>
                <span>Brew Coffee Anyway</span>
            </button>

            <!-- Back Home Button -->
            <button onclick="goHome()" class="w-full sm:w-auto px-6 py-3.5 rounded-xl bg-slate-700/60 border border-slate-600/50 text-slate-200 font-semibold text-sm tracking-wide hover:bg-slate-700 hover:text-white active:scale-95 transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-house"></i>
                <span>Back Home</span>
            </button>
        </div>

    </main>

    <!-- JavaScript Logic -->
    <script>
        // Interactive Brew Coffee function
        function attemptBrew() {
            const teapot = document.getElementById('teapot-svg');
            const msgBox = document.getElementById('message-box');
            const msgText = document.getElementById('message-text');

            // Add whistling animation temporarily
            teapot.classList.add('animate-whistle');

            // Set funny error message
            msgText.innerHTML = "<strong>Error 418:</strong> Short and stout! I cannot brew coffee, but I can offer you some nice Earl Grey tea. ☕";
            msgBox.classList.remove('hidden');

            // Remove whistling effect after a short time
            setTimeout(() => {
                teapot.classList.remove('animate-whistle');
            }, 1500);
        }

        // Home button function
        function goHome() {
            const msgBox = document.getElementById('message-box');
            const msgText = document.getElementById('message-text');

            msgText.innerHTML = "Navigating back to safety... 🚀";
            msgBox.classList.remove('hidden');

            setTimeout(() => {
                // Return home action or refresh mock
                window.location.href = '#';
            }, 1000);
        }

        // Teapot interactive click handler
        document.getElementById('teapot-svg').addEventListener('click', () => {
            attemptBrew();
        });
    </script>
</body>
</html>
